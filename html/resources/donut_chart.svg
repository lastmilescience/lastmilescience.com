<svg width="400" height="400" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Base Circle with Outline -->
    <circle cx="50" cy="50" r="35" stroke="#E5E7EB" stroke-width="15" />
    <circle cx="50" cy="50" r="42.5" stroke="#111827" stroke-width="0.75" />
    <circle cx="50" cy="50" r="27.5" stroke="#111827" stroke-width="0.75" />
    
    <!-- Primary Sector with Outline -->
    
    <!-- Background Ring -->
    <circle cx="50" cy="50" r="35" stroke="#E5E7EB" stroke-width="15" />
    
    <!-- Primary Segment -->
    <circle cx="50" cy="50" r="35" stroke="#f7bc9d" stroke-width="15" stroke-dasharray="150 220" transform="rotate(-90 50 50)" stroke-linecap="butt" />
    
    <!-- Secondary Segment -->
    <circle cx="50" cy="50" r="35" stroke="#bccbae" stroke-width="15" stroke-dasharray="30 210" stroke-dashoffset="-150" transform="rotate(-90 50 50)" stroke-linecap="butt" />
    
    <!-- Outlines -->
    <circle cx="50" cy="50" r="43" stroke="#111827" stroke-width="1" />
    <circle cx="50" cy="50" r="27" stroke="#111827" stroke-width="1" />
    
</svg>
